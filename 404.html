<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose City Roll 2026</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/bd27c299de.js" crossorigin="anonymous"></script>
    <link rel="icon" href="./media/bigrosecityroll(small).svg" type="image/x-icon">




</head>
<body>
    <div id="overlay"></div>
    <div id="err-container">
        <div id="err-msg-container">
            <img id="err-logo" src="/media/images/404-animated-web.webp" alt="404Blades-logo">
            <h2 class="err-msg">PAGE <span class="err">NOT</span> FOUND!</h2>
            
        </div>
        <div id="err-btn-container">
            <a id="err-goback-btn" href="https://www.rosecityroll.com/"><i class="fa-solid fa-arrow-left"></i> Go back</a>
            <a id="help-btn" href="https://www.instagram.com/404_blades/"><i class="fa-brands fa-instagram"></i> help</a>
        </div>
    </div>
    <video autoplay loop muted playsinline class="backdrop-vid">
            <source src="./media/vistastate.mp4" type="video/mp4">
        </video>
    
</body>
</html>
